name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux debug
            os: ubuntu-24.04
            configure: linux-debug
            preset: linux-debug
          - name: Linux release
            os: ubuntu-24.04
            configure: linux-release
            preset: linux-release
          - name: macOS debug
            os: macos-15
            configure: macos-debug
            preset: macos-debug
          # The windows preset asks for the Visual Studio 2022 generator, which windows-2025 no longer has.
          - name: Windows debug
            os: windows-2022
            configure: windows
            preset: windows-debug
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        id: python
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: python/requirements.txt

      - name: Install the Python test requirements
        run: python -m pip install -r python/requirements.txt

      - name: Show the tool versions
        if: runner.os != 'Windows'
        run: |
          cmake --version | head -n 1
          clang++ --version | head -n 1

      - name: Configure
        run: cmake --preset ${{ matrix.configure }} "-DPython3_EXECUTABLE=${{ steps.python.outputs.python-path }}"

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }} --parallel

      - name: Test
        run: ctest --preset ${{ matrix.preset }}
